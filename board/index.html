function nextAction(r,s){if(s.stop||s.no)return '';if(s.yes)return 'CLOSE: domain question, then close.sh';if(s.rep)return 'Reply inside 5 min. Paste their words to Athena.';
 if(!s.s1&&!s.s2)return r.type==='shop'?'Call first (shop line). If no answer, msg 1.':'Send msg 1.';
 if(s.s1&&!s.s2)return 'Wait ~2h after msg 1, then send the link.';
 if(s.s2&&!s.call)return 'Call ~90 min after the link.';
 if(s.s2&&s.call&&!s.dm)return 'Page DM if they have FB/IG.';return 'Monday final touch.';}
function render(){const now=new Date();document.getElementById('clock').textContent=now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
 const L=document.getElementById('list');L.innerHTML='';let c={s1:0,s2:0,call:0,dm:0,rep:0,yes:0};
 const list=ROWS.filter(r=>{const s=state(r);for(const k in c)if(s[k])c[k]++;
  if(tab==='all')return true;if(tab==='Mon'||tab==='Tue')return r.day===tab&&!(s.yes||s.no||s.stop);if(tab==='final')return s['x:'+r.chan]&&!(s.rep||s.yes||s.no||s.stop);if(tab==='A'||tab==='B'||tab==='C')return r.wave===tab&&!(s.yes||s.no||s.stop);if(tab==='solo')return r.type==='solo';if(tab==='shop')return r.type==='shop';if(tab==='hot')return s.rep||s.yes;if(tab==='done')return s.yes||s.no||s.stop;
  return !(s.yes||s.no||s.stop)});
 const xs=ROWS.reduce((n,r)=>n+(get(r.slug)['x:'+r.chan]?1:0),0);const nxt=(tab==='Mon'||tab==='Tue')?ROWS.filter(r=>r.day===tab&&!get(r.slug)['x:'+r.chan]).sort((a,b)=>a.slotMin-b.slotMin)[0]:null;document.getElementById('counts').textContent=(tab==='Mon'||tab==='Tue')?`sent ${xs}/113 · replies ${c.rep} · yes ${c.yes}${nxt?' · next: '+nxt.slot+' '+nxt.name:''}`:`msg1 ${c.s1} · links ${c.s2} · calls ${c.call} · DMs ${c.dm} · replies ${c.rep} · yes ${c.yes}`;
 const T=document.getElementById('tabs');T.innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('');
 if(tab==='Mon'||tab==='Tue'||tab==='final'){list.sort((a,b)=>(((state(b).rep||state(b).yes)?1:0)-((state(a).rep||state(a).yes)?1:0))||(a.slotMin-b.slotMin))}else list.sort((a,b)=>{const sa=state(a),sb=state(b);const ra=(sa.rep||sa.yes)?0:(sa.stop||sa.no)?9:sa.s2?2:1;const rb=(sb.rep||sb.yes)?0:(sb.stop||sb.no)?9:sb.s2?2:1;if(ra!==rb)return ra-rb;return (a.wave||'A').localeCompare(b.wave||'A')});
 let lastPhase=null;for(const r of list){const s=state(r);const d=document.createElement('div');d.className='card'+((s.yes||s.no||s.stop)?' done':'')+(s.rep?' hot':'');
  if(tab==='Mon'||tab==='Tue'||tab==='final'){const FINAL=tab==='final';if(!FINAL&&r.phase!==lastPhase){lastPhase=r.phase;const ph=document.createElement('div');ph.className='phase';ph.textContent=r.phase;L.appendChild(ph)}const CH={text:['TEXT via Google Voice',r.phone,'https://voice.google.com/u/0/messages?itemId=t.'+encodeURIComponent(r.tel),'Open in Voice','one','Copy text (link + $297)'],
    email:['EMAIL, draft already in Gmail',r.email,'https://mail.google.com/mail/u/0/#search/'+encodeURIComponent('in:drafts to:'+r.email),'Open the draft, press send','',''],
    ig:['INSTAGRAM DM','@'+r.ig,'https://ig.me/m/'+r.ig,'Open Instagram DM','dm','Copy DM (link + $297)'],
    fb:['FACEBOOK page DM',(r.fb.startsWith('p/')?'facebook.com/'+r.fb:'m.me/'+r.fb),(r.fb.startsWith('p/')?'https://www.facebook.com/'+r.fb:'https://m.me/'+r.fb),(r.fb.startsWith('p/')?'Open page, tap Message':'Open Messenger'),'dm','Copy DM (link + $297)']}[r.chan];
   const k=FINAL?'x:final':'x:'+r.chan;const sent=!!s[k];if(FINAL){if(r.chan==='email'){CH[4]='fu2';CH[5]='Copy final touch (email it)';CH[2]='https://mail.google.com/mail/u/0/#inbox?compose=new';CH[3]='Open Gmail'}else{CH[4]='fu2';CH[5]='Copy final touch (down at midnight)'}}
   d.innerHTML=`<div class="top"><h3><span class="slot">${FINAL?"":r.slot}</span>${r.name}</h3><small>${r.town} · ${r.rating}★ ${r.count}</small></div>
   <div class="chan ${r.chan}">${CH[0]} <b>${CH[1]}</b>${r.chan==='fb'?'<br><span style="font-weight:400">then one comment on their latest post: built u a site this weekend, sent it in messages</span>':''}</div>
   <div class="acts">${CH[4]?'<button class="p" onclick="copyMsg(\''+r.slug+'\',\''+CH[4]+'\',this)">'+CH[5]+'</button>':'<span></span>'}<a class="v" style="grid-column:auto" href="${CH[2]}" target="_blank">${CH[3]}</a></div>
   <div class="st"><label class="${sent?'on':''}"><input type="checkbox" ${sent?'checked':''} onchange="toggle('${r.slug}','${k}',this.checked)">sent</label>
    <label class="${s.rep?'on r':''}"><input type="checkbox" ${s.rep?'checked':''} onchange="toggle('${r.slug}','rep',this.checked)">REPLIED</label>
    <label class="${s.yes?'on c':''}"><input type="checkbox" ${s.yes?'checked':''} onchange="toggle('${r.slug}','yes',this.checked)">YES</label>
    <label class="${s.no?'on':''}"><input type="checkbox" ${s.no?'checked':''} onchange="toggle('${r.slug}','no',this.checked)">no</label>
    <a href="${r.site}" target="_blank" style="margin-left:auto;font-size:12px">site</a></div>
   <textarea class="note" placeholder="what they said" onchange="note('${r.slug}',this.value)">${(s.note||'').replace(/</g,'&lt;')}</textarea>`;
   L.appendChild(d);continue;}
  const body1=encodeURIComponent(r.msg1),body2=encodeURIComponent(s.s2&&r.sentLink?r.fu:r.msg2);
  const fb=r.fb?(r.fb.startsWith('p/')?'https://www.facebook.com/'+r.fb:'https://m.me/'+r.fb):('https://www.facebook.com/search/pages/?q='+encodeURIComponent(r.name+' '+r.town));
  d.innerHTML=`<div class="top"><h3>${r.name}</h3><small>${r.owner?r.owner+' · ':''}${r.phone}</small></div>
  <div class="meta"><b>${r.rating}★ ${r.count}</b> · ${r.town} · ${r.hours} · ${r.type==='shop'?'shop line':'cell'}${r.openSun?'':' · <span style=color:#b45309>likely closed Sun</span>'}</div>
  <div class="acts">
   <button class="p" onclick="copyMsg('${r.slug}','one',this)">Copy one-shot (link + $297)</button><button class="p" onclick="copyMsg('${r.slug}','s1',this)">Copy msg 1</button>
   <button class="s" onclick="copyMsg('${r.slug}','s2',this)">${s.s2&&r.sentLink?'Copy follow-up':'Copy link msg'}</button>
   <a class="v" href="https://voice.google.com/u/0/messages?itemId=t.${encodeURIComponent(r.tel)}" target="_blank">Open in Voice</a>
   <a href="tel:${r.tel}" onclick="mark('${r.slug}','call')">Call</a>
   <button class="p" onclick="copyMsg('${r.slug}','dm',this)">Copy DM</button>${r.ig?'<a class="s" target="_blank" href="https://ig.me/m/'+r.ig+'">Open Instagram DM</a>':''}
   <a class="v" href="${fb}" target="_blank">${r.fb?(r.fb.startsWith('p/')?'Open page, tap Message':'Open Messenger'):'Find page, then Message'}</a>
   <a href="${r.site}" target="_blank">Open site</a>
   <a href="${r.video||'#'}" class="${r.video?'':'dis'}" target="_blank">Video</a>
  </div>
  <div class="next">${nextAction(r,s)}</div>
  <div class="st">${KEYS.map(k=>`<label class="${s[k]?'on':''} ${k==='rep'?'r':''} ${k==='yes'?'c':''}"><input type="checkbox" ${s[k]?'checked':''} onchange="toggle('${r.slug}','${k}',this.checked)">${LBL[k]}</label>`).join('')}</div>
  <textarea class="note" placeholder="what they said" onchange="note('${r.slug}',this.value)">${(s.note||'').replace(/</g,'&lt;')}</textarea>
  <div class="msg"><b>msg 1:</b> ${r.msg1}\n\n<b>link msg:</b> ${r.msg2}</div>`;
  d.querySelector('h3').onclick=()=>d.classList.toggle('open');L.appendChild(d);}
}
function copyMsg(slug,k,btn){const r=ROWS.find(x=>x.slug===slug);const s=get(slug);const txt=k==='fu2'?r.fu2:k==='one'?r.one:k==='dm'?r.dm:k==='s1'?r.msg1:((s.s2&&r.sentLink)?r.fu:r.msg2);const done=()=>{btn.classList.add('ok');btn.textContent='Copied. Open the channel and paste';mark(slug,k==='one'?'s2':k)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>fallback())}else fallback();function fallback(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){prompt('Copy this:',txt)}ta.remove()}}
function stamp(){const d=new Date();return d.toISOString().slice(0,10)+' '+d.toTimeString().slice(0,5)}
function mark(slug,k){const s=get(slug);if(!s[k]){s[k]=stamp();set(slug,s);setTimeout(render,400)}}
function toggle(slug,k,on){const s=get(slug);s[k]=on?stamp():0;set(slug,s);render()}
function note(slug,v){const s=get(slug);s.note=v;set(slug,s)}
function exportLog(){const lines=ROWS.map(r=>{const s=get(r.slug);const f=[...KEYS,'x:text','x:email','x:ig','x:fb','x:final'].filter(k=>s[k]).map(k=>k+'@'+s[k]);return (f.length||s.note)?`${r.slug}: ${f.join(', ')}${s.note?' | '+s.note:''}`:null}).filter(Boolean);
 const txt='BOARD '+stamp()+'\n'+lines.join('\n');navigator.clipboard&&navigator.clipboard.writeText(txt);alert('Copied '+lines.length+' rows. Paste into chat.')}
render();setInterval(render,60000);
</script></body></html>
